<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>Mini Grand Prix · Gameplay</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07111f;
      color: #f7fbff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 15%, rgba(10, 132, 255, .22), transparent 38%),
        radial-gradient(circle at 84% 80%, rgba(25, 195, 125, .14), transparent 35%),
        #07111f;
    }

    main {
      width: min(1120px, 100vw);
      padding: clamp(12px, 3vw, 36px);
    }

    .player {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 24px;
      background: #02060b;
      box-shadow: 0 28px 90px rgba(0, 0, 0, .5);
    }

    video {
      display: block;
      width: 100%;
      aspect-ratio: 1662 / 1080;
      object-fit: contain;
      background: #02060b;
    }

    .topbar {
      position: absolute;
      inset: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 20px 42px;
      background: linear-gradient(rgba(0, 0, 0, .72), transparent);
      pointer-events: none;
    }

    .brand { font-weight: 800; letter-spacing: .02em; }

    .back {
      color: inherit;
      font-size: .88rem;
      text-decoration: none;
      pointer-events: auto;
      opacity: .82;
    }

    .back:hover { opacity: 1; }

    .hint {
      margin: 14px 4px 0;
      color: rgba(247, 251, 255, .65);
      font-size: .82rem;
      text-align: center;
    }

    @media (max-width: 640px) {
      main { padding: 0; }
      .player { border-radius: 0; border-inline: 0; }
      .topbar { padding: 14px 16px 34px; }
      .hint { padding-inline: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="player" aria-label="Mini Grand Prix gameplay video">
      <video autoplay muted loop playsinline controls preload="metadata">
        <source src="https://github.com/xhhdaxx/Mini-Grand-Prix/releases/download/gameplay-v1/home-gameplay.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
      </video>
      <div class="topbar">
        <span class="brand">🏁 Mini Grand Prix</span>
        <a class="back" href="https://github.com/xhhdaxx/Mini-Grand-Prix">View on GitHub ↗</a>
      </div>
    </section>
    <p class="hint">The video starts muted so browsers can autoplay it. Use the player controls to enable sound, pause, or enter fullscreen.</p>
  </main>
</body>
</html>
