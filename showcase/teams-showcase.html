<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Grand Prix · 六车阵涂装展示</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;padding:34px 18px 48px;
    background:#f4f4f4;color:#2b2b33;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;
    font-weight:900;letter-spacing:.4px;
  }
  .wrap{max-width:1180px;margin:0 auto}
  .head{text-align:center;margin-bottom:24px}
  .head h1{font-size:30px;letter-spacing:8px;margin:0 0 6px}
  .head .sub{font-size:11px;letter-spacing:4px;color:#888}
  .head .rule{display:inline-block;width:48px;height:3px;background:#ffd23f;vertical-align:middle;margin:0 10px;border-radius:2px}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  @media (max-width:920px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:580px){.grid{grid-template-columns:1fr}}

  .card{
    position:relative;
    padding:14px 16px 14px;
    border:2px dashed #2b2b33;border-radius:14px;background:#fff;
    text-align:center;
  }
  .card::before{
    content:"";position:absolute;left:14px;right:14px;top:0;height:4px;
    background:var(--team-color);border-radius:0 0 4px 4px;
  }
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
  .top .badge{
    font-size:10px;letter-spacing:3px;color:#666;
    display:flex;align-items:center;gap:6px;
  }
  .top .badge .dot{
    width:10px;height:10px;border-radius:50%;
    background:var(--team-color);border:1.5px solid #2b2b33;
  }
  .top .emoji{font-size:14px}

  .name{font-size:17px;letter-spacing:1.4px;margin:2px 0 0}
  .num{
    display:inline-block;margin-left:6px;
    background:#ffd23f;color:#2b2b33;
    padding:1px 8px;border-radius:6px;font-size:13px;
  }

  .canvas-wrap{
    display:flex;justify-content:center;align-items:center;
    height:300px;margin:6px 0 8px;
  }
  canvas{display:block}

  .specs{
    border-top:1.5px dashed #ddd;padding-top:8px;
    display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;
    font-size:10px;letter-spacing:1.5px;color:#666;text-align:left;
  }
  .specs b{color:#2b2b33;font-weight:900;letter-spacing:2px}
  .specs .swatch{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--accent);margin-right:5px;vertical-align:middle}

  .foot{margin-top:22px;text-align:center;font-size:10px;letter-spacing:3px;color:#999}
</style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <h1><span class="rule"></span>方程式 · 六 车 阵<span class="rule"></span></h1>
      <div class="sub">TEAM LIVERY SHOWCASE · 同比例俯视图 · W40 × H82</div>
    </div>
    <div class="grid" id="grid"></div>
    <div class="foot">RENDERED FROM src/renderer/car-render.js · STATIC LIVERY MODE</div>
  </div>

<script>
const TEAMS = [
  { team:'VECTOR', number:'12', color:'#4a6fa5', accent:'#c9d6df', emoji:'🔵', driver:'NOVA',     power:'ERS · 160HP', tyre:'M' },
  { team:'APEX',   number:'23', color:'#d4a017', accent:'#2d2d2d', emoji:'🟡', driver:'BLAZE',    power:'ERS · 160HP', tyre:'M' },
  { team:'HELIX',  number:'36', color:'#4b0082', accent:'#e6e6fa', emoji:'🟣', driver:'ORION',    power:'ERS · 160HP', tyre:'M' },
  { team:'ORBIT',  number:'17', color:'#e34234', accent:'#fff5e6', emoji:'🔴', driver:'COMET',    power:'ERS · 160HP', tyre:'M' },
  { team:'PULSE',  number:'88', color:'#008080', accent:'#ffffff', emoji:'🟢', driver:'ECHO',     power:'ERS · 160HP', tyre:'M' },
  { team:'PRISM',  number:'6',  color:'#1a1a1a', accent:'#c0c0c0', emoji:'⚫', driver:'ONYX',     power:'ERS · 160HP', tyre:'M' }
];

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// 与 src/renderer/car-render.js 完全一致的俯视方程式赛车造型。
// 仅剔除动态状态（boost / 锁胎 / 碰撞 / 烟雾 / 雨水 / 草屑 / 火焰 / 刹车灯），保留所有车身几何与比例。
function drawShowroomCar(ctx, car){
  const W = 40, H = 82;
  ctx.save();
  ctx.translate(-W/2, -H/2);

  // 阴影
  ctx.fillStyle = 'rgba(0,0,0,0.26)';
  roundRect(ctx, -W/2+3, -H/2+4, W, H, 7);
  ctx.fill();

  // 碳纤维底板与扩散器
  ctx.fillStyle = '#181a1f';
  ctx.beginPath();
  ctx.moveTo(-W*0.09, -H*0.34);
  ctx.lineTo(-W*0.34, H*0.24);
  ctx.lineTo(-W*0.27, H*0.43);
  ctx.lineTo(W*0.27, H*0.43);
  ctx.lineTo(W*0.34, H*0.24);
  ctx.lineTo(W*0.09, -H*0.34);
  ctx.closePath();
  ctx.fill();

  // 外露悬挂连杆
  ctx.strokeStyle = '#d8dde2';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-W*0.08, -H*0.31); ctx.lineTo(-W*0.4, -H*0.29);
  ctx.moveTo( W*0.08, -H*0.31); ctx.lineTo( W*0.4, -H*0.29);
  ctx.moveTo(-W*0.2,  H*0.17);  ctx.lineTo(-W*0.41, H*0.27);
  ctx.moveTo( W*0.2,  H*0.17);  ctx.lineTo( W*0.41, H*0.27);
  ctx.stroke();

  // 四个车轮：前轮小、后轮明显更宽
  const tires = [
    [-W*0.43, -H*0.29, 9, 17], [W*0.43, -H*0.29, 9, 17],
    [-W*0.44,  H*0.27, 11, 19], [W*0.44,  H*0.27, 11, 19]
  ];
  for (const [x,y,tw,th] of tires){
    ctx.fillStyle = '#16171b';
    roundRect(ctx, x-tw/2, y-th/2, tw, th, 3);
    ctx.fill();
    ctx.fillStyle = '#747983';
    ctx.beginPath(); ctx.arc(x, y, 2.6, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#333640';
    ctx.lineWidth = 1;
    for (const gx of [-2, 0, 2]){
      ctx.beginPath();
      ctx.moveTo(x+gx, y-th*0.34);
      ctx.lineTo(x+gx, y+th*0.34);
      ctx.stroke();
    }
  }

  // 分体倾斜前翼 + accent 描线 + 第二层襟翼
  ctx.fillStyle = car.color;
  ctx.strokeStyle = '#25262c';
  ctx.lineWidth = 2;
  for (const s of [-1, 1]){
    ctx.beginPath();
    ctx.moveTo(s*W*0.06, -H*0.46);
    ctx.lineTo(s*W*0.48, -H*0.5);
    ctx.lineTo(s*W*0.45, -H*0.4);
    ctx.lineTo(s*W*0.07, -H*0.43);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
  ctx.strokeStyle = car.accent;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-W*0.43, -H*0.44); ctx.lineTo(-W*0.1, -H*0.45);
  ctx.moveTo( W*0.43, -H*0.44); ctx.lineTo( W*0.1, -H*0.45);
  ctx.stroke();
  ctx.strokeStyle = '#111216';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(-W*0.44, -H*0.405); ctx.lineTo(-W*0.09, -H*0.42);
  ctx.moveTo( W*0.44, -H*0.405); ctx.lineTo( W*0.09, -H*0.42);
  ctx.stroke();

  // 细长车身、侧箱与尖鼻锥
  ctx.fillStyle = car.color;
  ctx.strokeStyle = '#25262c';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(0, -H*0.5);
  ctx.lineTo(W*0.07, -H*0.16);
  ctx.lineTo(W*0.13, -H*0.08);
  ctx.lineTo(W*0.3,   H*0.03);
  ctx.lineTo(W*0.32,  H*0.25);
  ctx.lineTo(W*0.2,   H*0.4);
  ctx.lineTo(-W*0.2,  H*0.4);
  ctx.lineTo(-W*0.32, H*0.25);
  ctx.lineTo(-W*0.3,  H*0.03);
  ctx.lineTo(-W*0.13, -H*0.08);
  ctx.lineTo(-W*0.07, -H*0.16);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // 两侧进气口
  ctx.fillStyle = '#111216';
  roundRect(ctx, -W*0.29, H*0.02, W*0.1, H*0.11, 2); ctx.fill();
  roundRect(ctx,  W*0.19, H*0.02, W*0.1, H*0.11, 2); ctx.fill();

  // 中央涂装 accent
  ctx.fillStyle = car.accent;
  ctx.beginPath();
  ctx.moveTo(0, -H*0.45);
  ctx.lineTo(W*0.045, -H*0.12);
  ctx.lineTo(W*0.1,    H*0.36);
  ctx.lineTo(-W*0.1,   H*0.36);
  ctx.lineTo(-W*0.045, -H*0.12);
  ctx.closePath();
  ctx.fill();

  // 侧箱肩线 accent
  ctx.strokeStyle = car.accent;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-W*0.24, H*0.02);
  ctx.quadraticCurveTo(-W*0.34, H*0.12, -W*0.22, H*0.34);
  ctx.moveTo(W*0.24, H*0.02);
  ctx.quadraticCurveTo(W*0.34, H*0.12, W*0.22, H*0.34);
  ctx.stroke();

  // 引擎盖脊线 + 散热开口
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, H*0.18);
  ctx.lineTo(0, H*0.36);
  ctx.stroke();
  ctx.fillStyle = '#292b31';
  ctx.fillRect(-W*0.13, H*0.31, W*0.26, 3);

  // 单座驾驶舱
  ctx.fillStyle = '#20242b';
  ctx.beginPath();
  ctx.ellipse(0, H*0.08, W*0.18, H*0.18, 0, 0, Math.PI*2);
  ctx.fill();

  // Halo 防滚架
  ctx.strokeStyle = '#edf0f3';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, H*0.05, W*0.13, Math.PI, 0);
  ctx.moveTo(0, H*0.05);
  ctx.lineTo(0, H*0.17);
  ctx.stroke();

  // 后翼 + 中央雨灯
  ctx.fillStyle = '#111216';
  ctx.strokeStyle = '#25262c';
  roundRect(ctx, -W*0.42, H*0.4, W*0.84, 7, 2);
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#555962';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-W*0.39, H*0.425);
  ctx.lineTo( W*0.39, H*0.425);
  ctx.stroke();
  // 后翼端板
  ctx.fillStyle = '#111216';
  ctx.fillRect(-W*0.46, H*0.38, 3, 11);
  ctx.fillRect( W*0.46-3, H*0.38, 3, 11);
  // 后翼车队缩写
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 5px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(car.team || '', 0, H*0.45);
  // 静态雨灯（深红）
  ctx.fillStyle = '#961e25';
  ctx.fillRect(-2, H*0.48, 4, 4);

  // 鼻锥赛车编号
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#25262c';
  ctx.lineWidth = 1.5;
  ctx.font = 'bold 9px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeText(car.number, 0, -H*0.22);
  ctx.fillText(car.number, 0, -H*0.22);

  ctx.restore();
}

const grid = document.getElementById('grid');
for (const t of TEAMS){
  const card = document.createElement('div');
  card.className = 'card';
  card.style.setProperty('--team-color', t.color);
  card.style.setProperty('--accent', t.accent);
  card.innerHTML = `
    <div class="top">
      <div class="badge"><span class="dot"></span>CONSTRUCTOR</div>
      <div class="emoji">${t.emoji}</div>
    </div>
    <div class="name">${t.team}<span class="num">#${t.number}</span></div>
    <div class="canvas-wrap"><canvas></canvas></div>
    <div class="specs">
      <div><b>DRIVER</b><br>${t.driver}</div>
      <div><b>UNIT</b><br>${t.power}</div>
      <div><b>TYRE</b><br>${t.tyre} · 中性</div>
      <div><b>ACCENT</b><br><span class="swatch"></span>${t.accent.toUpperCase()}</div>
    </div>
  `;
  grid.appendChild(card);

  const canvas = card.querySelector('canvas');
  const SCALE = 3.4;
  const cssW = 40 * SCALE + 24;
  const cssH = 82 * SCALE + 24;
  const dpr = window.devicePixelRatio || 1;
  canvas.width  = cssW * dpr;
  canvas.height = cssH * dpr;
  canvas.style.width  = cssW + 'px';
  canvas.style.height = cssH + 'px';

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.translate(cssW / 2, cssH / 2);
  ctx.scale(SCALE, SCALE);
  drawShowroomCar(ctx, t);
}
</script>
</body>
</html>
